</style></head><body><div class="shell"><header class="head"><button class="brand" onclick="go('home')">QUIZZES IT</button><nav><button onclick="go('catalog')">All quizzes</button><button onclick="go('how')">How it works</button><button onclick="go('support')">Support</button></nav><button class="lang">EN</button></header><main id="app"></main><footer><span>© Quizzes it</span><button onclick="go('privacy')">Privacy</button><button onclick="go('terms')">Terms</button><button onclick="go('support')">Support</button></footer></div><script>const A=document.getElementById('app');let token='',qs=[],ans=[];function put(x){A.innerHTML='<section class="wrap">'+x+'</section>'}function go(v){location.hash=v;draw()}function home(){put('<section class="hero"><div class="content"><p class="ey">PRIVATE SELF-DISCOVERY</p><h1>What do you protect when no one is watching?</h1><p class="lead">A thoughtful, playful read on the instinct beneath your choices.</p><div class="intro"><div class="mark">☆</div><div><strong>Find your hidden pattern</strong><span>12 questions · around 3 minutes</span></div></div><button class="primary" onclick="go(&quot;catalog&quot;)">Choose this quiz　→</button><p class="micro">Private access by email. No sign-up required.</p></div></section>')}function catalog(){put('<section class="page"><p class="ey">ALL QUIZZES</p><h1>Find the question that follows you around.</h1><p class="lead">One quiet moment. One honest answer at a time.</p><div class="list"><article class="row"><small>01</small><div><h2>How Do You Seek Recognition?</h2><p>A playful look at attention, validation and vulnerability.</p><small>12 questions · around 3 minutes</small></div><button class="primary" onclick="go(&quot;how_do_you_seek_recognition&quot;)">View quiz →</button></article><article class="row"><small>02</small><div><h2>What is your social battery?</h2><p>Explore the conditions that refill—or drain—your social energy.</p></div><span>Coming soon</span></article></div></section>')}function detail(){put('<section class="page"><button class="back" onclick="go(&quot;catalog&quot;)">← Back</button><p class="ey">FIRST QUIZ</p><h1>How Do You Seek Recognition?</h1><p class="lead">Explore the instinct beneath validation, attention and vulnerability.</p><div class="facts"><span>12 questions · around 3 minutes</span><span>Private email access for 7 days</span><span>HK$20</span></div><button class="primary" onclick="go(&quot;email&quot;)">Choose this quiz　→</button><p class="micro">One-time payment. No sign-up required.</p><p class="micro">All purchases are final — no refunds or exchanges after payment, except where required by law.</p></section>')}function how(){put('<section class="page"><p class="ey">HOW IT WORKS</p><h1>Simple by design.</h1><div class="cards how-cards"><article class="card"><b>01</b><h2>Choose a quiz</h2><p>Start with the question you are curious about.</p></article><article class="card"><b>02</b><h2>Answer 5 free questions</h2><p>Receive an early signal before deciding whether to continue.</p></article><article class="card"><b>03</b><h2>Unlock for HK$29</h2><p>Use secure checkout only when you want the full analysis.</p></article><article class="card"><b>04</b><h2>Continue privately</h2><p>We email a personal link for your remaining questions and result.</p></article></div></section>')}function email(){put('<section class="page"><p class="ey">YOUR PRIVATE ACCESS</p><h1>Where should we send your quiz link?</h1><p class="lead">After payment, we will email one secure link. It stays valid for 7 days.</p><form class="form" id="f"><input id="email" type="email" placeholder="you@example.com" required><button class="primary">Continue to secure payment　→</button></form><p class="micro">No sign-up. No mailing list. We use this only for purchase and access.</p></section>');f.onsubmit=pay}async function pay(e){e.preventDefault();let r=await fetch('/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById("email").value})}),z=await r.json();if(r.ok)location=z.checkoutUrl;else alert(z.error)}function support(){put('<section class="page"><p class="ey">SUPPORT</p><h1>We are here if your link is not.</h1><p class="lead">For a missing email, expired link, payment issue or privacy question, contact us and include the email used at checkout.</p><h2><a class="contact-link" href="mailto:hello@quizzes.it.com">hello@quizzes.it.com</a></h2><p class="micro">We usually reply within 1–2 business days.</p><div class="cards"><article class="card"><h2>Missing link?</h2><p>Check spam, then contact us from the purchase email address.</p></article><article class="card"><h2>Link expired?</h2><p>Contact support before purchasing again so we can help you understand your options.</p></article><article class="card"><h2>Payment issue?</h2><p>Include your purchase email and approximate payment time.</p></article></div></section>')}function privacy(){put('<section class="page"><p class="ey">PRIVATE BY DESIGN</p><h1>Privacy Notice</h1><p class="lead">We use your email to send your purchase confirmation and private access link. Quiz answers and results are temporary; we do not create a permanent quiz-history account.</p><h2>Final purchases</h2><p class="lead">All purchases are final, except where required by law.</p></section>')}function terms(){put('<section class="page"><p class="ey">CLEAR, NOT CLINICAL</p><h1>Terms of Use</h1><p class="lead">Quizzes it provides a digital self-reflection product for personal use. It is not medical, psychological, or diagnostic advice.</p><h2>Access and payment</h2><p class="lead">Payment unlocks one private quiz link for seven days. Purchases are final except where required by law. For help with payment or access, contact hello@quizzes.it.com.</p></section>')}async function access(){let r=await fetch('/api/access/'+token),z=await r.json();if(!r.ok)return put('<h1>This link is no longer available.</h1>');qs=z.questions;ask(0)}function ask(i){if(i>=qs.length)return put('<h1>Your result</h1>');put('<section class="page"><p class="ey">GO WITH YOUR FIRST INSTINCT</p><h1>'+qs[i].text+'</h1><div class="answers">'+qs[i].options.map((x,n)=>'<button class="answer" onclick="pick('+i+','+(n+1)+')">'+x+'　→</button>').join('')+'</div></section>')}function pick(i,n){ans[i]=n;ask(i+1)}function draw(){let p=location.pathname,h=location.hash.slice(1);if(p==='/payment-success')return put('<section class="page"><p class="ey">PAYMENT STATUS PENDING</p><h1>We are verifying your payment.</h1><p class="lead">Your quiz link is emailed only after Stripe confirms payment. If you have paid, allow a moment for confirmation.</p></section>');if(p==='/payment-cancelled')return put('<section class="page"><h1>Nothing was charged.</h1></section>');if(p.startsWith('/access/')){token=p.split('/').pop();return access()}if(h==='detail'){location.replace('#how_do_you_seek_recognition');return}return ({home,catalog,how_do_you_seek_recognition:detail,how,email,support,privacy,terms}[h]||home)()}onhashchange=draw;draw();</script><script src="/multi-quiz.js"></script></body></html>
